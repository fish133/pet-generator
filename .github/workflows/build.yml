name: Release APK

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '*.gradle'
      - '*.properties'
      - 'generate_icon.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Download latest APK
        run: |
          for i in 1 2 3; do
            curl -L --retry 3 --retry-delay 5 -o pet-generator-latest.apk "https://aka.doubaocdn.com/s/VVtmNctsjU" && break
            echo "Download attempt $i failed, retrying..."
            sleep 5
          done
          ls -la pet-generator-latest.apk
          test -s pet-generator-latest.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: 桌宠生成器 (最新构建)
          prerelease: true
          make_latest: true
          body: |
            ## 桌宠生成器 (最新构建)

            上传任意 GIF 表情包，自动变成可互动的安卓桌面悬浮窗桌宠。

            ### v2.2.0
            - 上传 GIF 时可选择帧数：12帧 / 15帧 / 30帧
            - 12帧更流畅省内存，30帧更细腻

            ### v2.1.0
            - 包名重构：com.petgen.app
            - 修复长按菜单崩溃
          files: pet-generator-latest.apk
