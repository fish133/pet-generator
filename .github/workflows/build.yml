name: Release APK

on:
  push:
    branches: [main]

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Download latest APK
        run: wget -q -O pet-generator-latest.apk "https://aka.doubaocdn.com/s/YaXVOvfBnu"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: 桌宠生成器 (最新构建)
          prerelease: true
          make_latest: true
          body: |
            ## 桌宠生成器 (最新构建)

            上传任意 GIF 表情包，自动变成可互动的安卓桌面悬浮窗桌宠。

            ### 下载
            直接下载下方 Assets 中的 APK 安装即可。

            ### 功能
            - 上传 GIF 即桌宠（自动拆帧最多15帧）
            - 短按切换下一个 GIF
            - 长按打开表情菜单（切换/删除/关闭）
            - 自定义大小 80~400dp
            - 自定义气泡文案，10~40秒随机弹出
            - 自由拖动位置

            ### v2.0.7 修复
            - 修复点击切换GIF播放完毕后访问已回收位图导致的崩溃
            - 修复GIF解析时inputStream未安全关闭的资源泄漏
            - 修复帧缩放时临时Bitmap未回收的内存泄漏
            - 增加GIF尺寸为0时的保护
            - 修复占位图标Bitmap未回收
          files: pet-generator-latest.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
