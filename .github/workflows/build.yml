name: Release APK

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '*.gradle'
      - '*.properties'
      - 'generate_icon.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Download latest APK
        run: |
          for i in 1 2 3; do
            curl -L --retry 3 --retry-delay 5 -o pet-generator-latest.apk "https://aka.doubaocdn.com/s/irMNfc5ViN" && break
            echo "Download attempt $i failed, retrying..."
            sleep 5
          done
          ls -la pet-generator-latest.apk
          test -s pet-generator-latest.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: 桌宠生成器 (最新构建)
          prerelease: true
          make_latest: true
          body: |
            ## 桌宠生成器 (最新构建)

            上传任意 GIF 表情包，自动变成可互动的安卓桌面悬浮窗桌宠。

            ### v2.3.1
            - 修复 loadFramesForGif 立即回收旧 Bitmap 导致动画线程黑屏/崩溃
            - 改为延迟 500ms 回收旧帧，等待动画切换到新帧后再释放内存

            ### v2.3.0
            - 新增点击音效：鸭子音效 / 冰冰冰音效（可二选一）
            - 音效开关和选择在「自定义气泡文案」下方
            - 从参考视频截取真实音效素材，非 AI 生成
            - SoundPool 播放，Service 销毁时自动释放

            ### v2.2.2
            - 修复 loadFramesForGif 多线程竞争导致的 Bitmap 回收崩溃
            - getCurrentIdleFrames 不再在主线程执行文件 I/O
            - MainActivity GIF 数量统计移到后台线程

            ### v2.2.1
            - 修复主线程文件 I/O 导致的 UI 卡顿
            - GIF 加载/切换/删除全部移到后台线程

            ### v2.2.0
            - 上传 GIF 时可选择帧数：12帧 / 15帧 / 30帧
          files: pet-generator-latest.apk
