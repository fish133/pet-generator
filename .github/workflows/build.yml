name: Build and Release

on:
  push:
    branches: [main]
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate app icons
        run: |
          pip install Pillow
          python3 generate_icon.py

      - name: Build Debug APK
        run: |
          chmod +x gradlew 2>/dev/null || true
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF_NAME#v}
            APK_NAME="pet-generator-v${VERSION}.apk"
            RELEASE_NAME="桌宠生成器 v${VERSION}"
            TAG_NAME="$GITHUB_REF_NAME"
            PRERELEASE="false"
          else
            APK_NAME="pet-generator-latest.apk"
            RELEASE_NAME="桌宠生成器 (最新构建)"
            TAG_NAME="latest"
            PRERELEASE="true"
          fi
          cp app/build/outputs/apk/debug/app-debug.apk "$APK_NAME"
          echo "APK_NAME=$APK_NAME" >> $GITHUB_ENV
          echo "RELEASE_NAME=$RELEASE_NAME" >> $GITHUB_ENV
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV
          echo "PRERELEASE=$PRERELEASE" >> $GITHUB_ENV

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: ${{ env.RELEASE_NAME }}
          prerelease: ${{ env.PRERELEASE }}
          body: |
            ## ${{ env.RELEASE_NAME }}

            上传任意 GIF 表情包，自动变成可互动的安卓桌面悬浮窗桌宠。

            ### 下载
            直接下载下方 Assets 中的 APK 安装即可。

            ### 功能
            - 上传 GIF 即桌宠（自动拆帧最多15帧）
            - 短按切换下一个 GIF
            - 长按打开表情菜单（切换/删除/关闭）
            - 自定义大小 80~400dp
            - 自定义气泡文案，10~40秒随机弹出
            - 自由拖动位置
          files: |
            ${{ env.APK_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
